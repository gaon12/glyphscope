name: CI

on:
  push:
    branches:
      - main
      - harden-package-ci
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [14, 18, 20]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Upgrade npm for Node 14 compatibility
        if: matrix.node-version == 14
        run: npm install --global npm@9

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint checks
        run: npm run lint
